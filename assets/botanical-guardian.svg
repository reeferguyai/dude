  <title id="title">GanjaGroot, the ReeferDude botanical guardian</title>
  <desc id="desc">An original, friendly tree spirit with a leafy crown, warm golden eyes, and an ember-tipped blunt held in one hand. Soft emerald smoke curls into glowing zero-gravity loops around the character.</desc>
